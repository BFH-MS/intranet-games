<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Breakout Game</title>
  <style>
    body, html {
      background-color: #222;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      margin: 0;
      font-family: 'Arial', sans-serif;
    }

    #gameTitle {
      color: #FFFAF0;
      font-size: 28px;
      margin-bottom: 10px;
      text-shadow: 2px 2px 5px #8B0000;
    }

    #infoText {
      color: #FFFAF0;
      font-size: 18px;
      margin-bottom: 15px;
      text-shadow: 1px 1px 4px #006400;
    }

    canvas {
      image-rendering: pixelated;
      image-rendering: optimizeSpeed;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: optimize-contrast;
      border: 3px solid #FFF;
      background: linear-gradient(#1a1a2e, #16213e);
      box-shadow: 0 0 15px 5px rgba(255, 255, 255, 0.2);
    }

    #gameOver {
      display: none;
      position: absolute;
      color: white;
      font-size: 24px;
      text-align: center;
      background: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 10px;
    }

    .powerup {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="gameTitle">🎄 Breakout Game 🎄</div>
  <div id="infoText">Use arrow keys to move. Press Shift to launch the ball. Break all the blocks to win!</div>
  <canvas id="game-canvas" width="640" height="640"></canvas>
  <div id="gameOver"></div>
  <script>
    // RequestAnimationFrame shim
    (function() {
      var requestAnimationFrame = window.requestAnimationFrame || 
                                window.mozRequestAnimationFrame || 
                                window.webkitRequestAnimationFrame || 
                                window.msRequestAnimationFrame;
      window.requestAnimationFrame = requestAnimationFrame;
    })();

    // Utility functions
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function valueInRange(value, min, max) {
      return (value <= max) && (value >= min);
    }

    function checkRectCollision(A, B) {
      var xOverlap = valueInRange(A.x, B.x, B.x + B.w) ||
                     valueInRange(B.x, A.x, A.x + A.w);
      var yOverlap = valueInRange(A.y, B.y, B.y + B.h) ||
                     valueInRange(B.y, A.y, A.y + A.h);
      return xOverlap && yOverlap;
    }

    // Constants
    const CANVAS_WIDTH = 640;
    const CANVAS_HEIGHT = 640;
    const LEFT_KEY = 37;
    const RIGHT_KEY = 39;
    const SHIFT_KEY = 16;
    const BLOCKS_PER_ROW = 10;
    const BLOCK_ROWS = 6;
    const BLOCK_WIDTH = CANVAS_WIDTH / BLOCKS_PER_ROW;
    const BLOCK_COLOURS = ['#FFD700', '#FF4500', '#FF6347', '#FF69B4', '#00FF7F', '#ADD8E6'];
    const INITIAL_BALL_SPEED = 8;
    const SPEED_INCREASE_INTERVAL = 5000;
    const MOVE_DOWN_INTERVAL = 5000; // 5 seconds for testing
    const BALL_SPEED_INCREASE_RATE = 1.0002; // Subtle speed increase over time
    const BALL_WALL_BUFFER = 2; // Prevents ball from getting stuck in walls

    const PHYSICS = {
      BALL_SPIN_INFLUENCE: 0.3,
      MAX_BALL_SPEED: 15,
      MIN_BALL_SPEED: 4,
      BALL_DAMPENING: 0.98,
      GRAVITY: 0.2
    };

    const POWERUP_TYPES = {
      WIDER_PADDLE: { color: '#FFD700', duration: 10000, maxMultiplier: 2 },
      EXTRA_LIFE: { color: '#FF69B4', duration: 0 },
      MULTI_BALL: { color: '#9932CC', duration: 10000 }
    };

    const DIFFICULTY = {
        INITIAL_BLOCK_SPEED: 5000,    // Initial interval for blocks moving down
        MIN_BLOCK_SPEED: 1500,        // Decreased minimum to allow for faster descent
        SPEED_INCREASE_RATE: 100,     // Base decrease rate
        SCORE_IMPACT: 250,             // How much score affects block descent speed
        BALL_ACCELERATION: 1.0003,    
        MAX_BALL_ACCELERATION: 1.002   
    };

    const POWERUP_SPAWN_CHANCE = 0.15; 

    const POWERUP_TIMING = {
        MIN_SPAWN_INTERVAL: 5000,  
        MAX_SPAWN_INTERVAL: 15000,  
        FORCE_SPAWN_AFTER: 20000    
    };

    // Particle System
    class ParticleSystem {
      constructor() {
        this.particles = [];
      }

      createExplosion(x, y, color, count = 15, type = 'block') {
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 / count) * i;
          const speed = type === 'block' ? 2 + Math.random() * 2 : 1 + Math.random();
          
          this.particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: type === 'block' ? 3 + Math.random() * 3 : 2 + Math.random() * 2,
            color: color,
            life: 1,
            type: type,
            gravity: type === 'powerup' ? 0.05 : 0
          });
        }
      }

      update() {
        this.particles = this.particles.filter(p => p.life > 0);
        
        this.particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.life -= p.type === 'block' ? 0.02 : 0.01;
          
          if (p.type === 'powerup') {
            p.vx *= 0.98;
            p.vy *= 0.98;
          }
        });
      }

      draw(ctx) {
        this.particles.forEach(p => {
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          
          if (p.type === 'powerup') {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillRect(p.x, p.y, p.size, p.size);
          }
        });
        ctx.globalAlpha = 1;
      }
    }

    // Globals
    var canvas = null;
    var ctx = null;
    var input = [];
    var score = 0;
    var lives = 3;
    var lastSpeedIncreaseTime = 0;
    var gameStarted = true;
    var gameEnded = false;
    var particleSystem = new ParticleSystem();
    var powerups = [];
    var extraBalls = [];
    var multiBallActive = false;
    var lastPowerupTime = Date.now();
    var powerupCooldown = 1000; // Minimum time between powerup spawns (1 second)
    var maxActivePowerups = 3;  // Maximum number of powerups on screen
    var lastPowerupSpawnTime = Date.now();  // Track last actual spawn time

    // Player object
    var player = {
      originalWidth: 100,
      width: 100,
      height: 10,
      position: { x: 0, y: 0 },
      bounds: { x: 0, y: 0, w: 0, h: 0 },

      init: function() {
        this.width = this.originalWidth;
        this.position.x = CANVAS_WIDTH / 2 - this.width / 2;
        this.position.y = CANVAS_HEIGHT - 30;
      },

      update: function() {
        if (input[LEFT_KEY]) this.position.x -= 8;
        if (input[RIGHT_KEY]) this.position.x += 8;

        this.position.x = Math.max(0, Math.min(CANVAS_WIDTH - this.width, this.position.x));
        this.bounds.x = this.position.x;
        this.bounds.y = this.position.y;
        this.bounds.w = this.width;
        this.bounds.h = this.height;
      },

      draw: function() {
        ctx.fillStyle = '#FFFAF0';
        ctx.fillRect(this.position.x, this.position.y, this.width, this.height);
      }
    };

    // Ball object
    var ball = {
      width: 10,
      height: 10,
      position: { x: 0, y: 0 },
      velocity: { x: 0, y: 0 },
      bounds: { x: 0, y: 0, w: 0, h: 0 },
      playerStick: true,
      spin: 0,

      init: function() {
        this.position.x = (player.position.x + player.width / 2) - this.width / 2;
        this.position.y = player.position.y - 15;
        this.velocity.x = 0;
        this.velocity.y = 0;
        this.playerStick = true;
        this.spin = 0;
      },

      launch: function() {
        this.playerStick = false;
        this.velocity.x = getRandomInt(-2, 2);
        this.velocity.y = -INITIAL_BALL_SPEED;
        this.spin = 0;
        wall.gameActive = true;
        wall.lastMoveTime = Date.now();
        console.log('Game started, wall movement activated');
      },

      updatePhysics: function() {
        this.velocity.x += this.spin * PHYSICS.BALL_SPIN_INFLUENCE;
        this.velocity.x *= PHYSICS.BALL_DAMPENING;
        this.velocity.y *= PHYSICS.BALL_DAMPENING;
        
        // Progressive speed increase based on score
        const currentAcceleration = Math.min(
            DIFFICULTY.MAX_BALL_ACCELERATION,
            DIFFICULTY.BALL_ACCELERATION * (1 + score/500)
        );
        this.velocity.x *= currentAcceleration;
        this.velocity.y *= currentAcceleration;
        
        const maxHorizontalSpeed = Math.abs(this.velocity.y * 0.75); 
        if (Math.abs(this.velocity.x) > maxHorizontalSpeed) {
            this.velocity.x = Math.sign(this.velocity.x) * maxHorizontalSpeed;
        }

        let speed = Math.hypot(this.velocity.x, this.velocity.y);
        if (speed > PHYSICS.MAX_BALL_SPEED) {
            this.velocity.x *= PHYSICS.MAX_BALL_SPEED / speed;
            this.velocity.y *= PHYSICS.MAX_BALL_SPEED / speed;
        } else if (speed < PHYSICS.MIN_BALL_SPEED) {
            this.velocity.x *= PHYSICS.MIN_BALL_SPEED / speed;
            this.velocity.y *= PHYSICS.MIN_BALL_SPEED / speed;
        }

        // Prevent near-zero horizontal velocity
        if (Math.abs(this.velocity.x) < 0.1) {
            this.velocity.x = Math.sign(this.velocity.x) || 1 * 0.1;
        }
      },

      update: function() {
        if (this.playerStick) {
          this.position.x = (player.position.x + player.width / 2) - this.width / 2;
          this.position.y = player.position.y - 15;
        } else {
          this.updatePhysics();
          this.position.x += this.velocity.x;
          this.position.y += this.velocity.y;

          // Improved wall collision detection for all walls
          if (this.position.x <= BALL_WALL_BUFFER) {
            this.position.x = BALL_WALL_BUFFER;
            this.velocity.x = Math.abs(this.velocity.x); // Force positive x velocity
            this.spin *= -0.5;
          } else if (this.position.x >= CANVAS_WIDTH - this.width - BALL_WALL_BUFFER) {
            this.position.x = CANVAS_WIDTH - this.width - BALL_WALL_BUFFER;
            this.velocity.x = -Math.abs(this.velocity.x); // Force negative x velocity
            this.spin *= -0.5;
          }

          // Add top wall buffer
          if (this.position.y <= BALL_WALL_BUFFER) {
            this.position.y = BALL_WALL_BUFFER;
            this.velocity.y = Math.abs(this.velocity.y); // Force downward velocity
            this.spin *= 0.5;
          }

          if (this.position.y < 0) {
            this.velocity.y *= -1;
            this.spin *= 0.5;
          }

          if (checkRectCollision(this.bounds, player.bounds)) {
            this.velocity.y = -Math.abs(this.velocity.y);
            let hitX = (this.position.x + this.width/2) - (player.position.x + player.width/2);
            let normalizedHitX = hitX / (player.width/2);
            this.spin = normalizedHitX * 0.2;
            this.velocity.x = normalizedHitX * 8;
          }

          if (this.position.y > CANVAS_HEIGHT) {
            if (this === ball && extraBalls.length === 0) {
                lives--;
                this.playerStick = true;
                if (lives === 0) {
                    window.parent.postMessage({
                        score: score
                    }, '*');
                    endGame();
                }
            }
          }
        }

        this.bounds.x = this.position.x;
        this.bounds.y = this.position.y;
        this.bounds.w = this.width;
        this.bounds.h = this.height;
      },

      draw: function() {
        ctx.fillStyle = '#ff0000';
        ctx.beginPath();
        ctx.arc(this.position.x + this.width / 2, this.position.y + this.height / 2, this.width / 2, 0, Math.PI * 2);
        ctx.fill();
      }
    };

    function createNewBall() {
        return {
            ...ball,
            width: 10,
            height: 10,
            position: { x: ball.position.x, y: ball.position.y },
            velocity: {
                x: getRandomInt(-5, 5),
                y: -INITIAL_BALL_SPEED
            },
            bounds: { x: 0, y: 0, w: 10, h: 10 },
            playerStick: false,
            spin: 0,
            update: ball.update,
            draw: ball.draw,
            updatePhysics: ball.updatePhysics
        };
    }

    // Block class
    var Block = function(x, y, color) {
      this.position = { x: x, y: y };
      this.width = BLOCK_WIDTH;
      this.height = 25;
      this.bounds = { x: x, y: y, w: BLOCK_WIDTH, h: 25 };
      this.color = color;
      this.hit = false;
    };

    Block.prototype.checkCollision = function() {
        // Check main ball
        if (checkRectCollision(this.bounds, ball.bounds) && !this.hit) {
            this.handleHit(ball);
            return true;
        }
        
        // Check extra balls
        for (let extraBall of extraBalls) {
            if (checkRectCollision(this.bounds, extraBall.bounds) && !this.hit) {
                this.handleHit(extraBall);
                return true;
            }
        }
        return false;
    };

    Block.prototype.handleHit = function(hitBall) {
        if (this.hit) return;
        
        this.hit = true;
        hitBall.velocity.y *= -1;
        score += 10;
        
        particleSystem.createExplosion(
            this.position.x + this.width/2,
            this.position.y + this.height/2,
            this.color
        );

        const currentTime = Date.now();
        const timeSinceLastSpawn = currentTime - lastPowerupSpawnTime;
        
        // Determine if we should spawn a powerup
        const shouldSpawn = 
            // Basic random chance
            Math.random() < POWERUP_SPAWN_CHANCE && 
            // Not too many powerups on screen
            powerups.length < maxActivePowerups &&
            // Either minimum time has passed OR we've hit the force spawn time
            (timeSinceLastSpawn >= POWERUP_TIMING.MIN_SPAWN_INTERVAL || 
             timeSinceLastSpawn >= POWERUP_TIMING.FORCE_SPAWN_AFTER) &&
            // Not spawning too quickly
            currentTime - lastPowerupTime > powerupCooldown;

        if (shouldSpawn || timeSinceLastSpawn >= POWERUP_TIMING.FORCE_SPAWN_AFTER) {
            const types = Object.keys(POWERUP_TYPES);
            const randomType = types[Math.floor(Math.random() * types.length)];
            powerups.push({
                x: this.position.x + this.width/2,
                y: this.position.y + this.height/2,
                type: randomType,
                width: 20,
                height: 20,
                speed: 2
            });
            
            particleSystem.createExplosion(
                this.position.x + this.width/2,
                this.position.y + this.height/2,
                POWERUP_TYPES[randomType].color,
                10,
                'powerup'
            );
            
            lastPowerupTime = currentTime;
            lastPowerupSpawnTime = currentTime;
        }

        document.getElementById('hitSound').play();
    };

    Block.prototype.draw = function() {
      ctx.fillStyle = this.color;
      ctx.fillRect(this.position.x, this.position.y, this.width, this.height);
    };
        // Wall object
        var wall = {
      blocks: [],
      moveDownInterval: DIFFICULTY.INITIAL_BLOCK_SPEED,
      lastMoveTime: 0,
      gameActive: false,

      init: function() {
        this.blocks = [];
        this.gameActive = false;
        this.lastMoveTime = Date.now();
        this.moveDownInterval = DIFFICULTY.INITIAL_BLOCK_SPEED;
        this.addInitialRows(3);
      },

      addInitialRows: function(numRows) {
        for (let row = 0; row < numRows; row++) {
          for (let col = 0; col < BLOCKS_PER_ROW; col++) {
            const block = new Block(
              col * BLOCK_WIDTH,
              row * 25,
              BLOCK_COLOURS[Math.floor(Math.random() * BLOCK_COLOURS.length)]
            );
            this.blocks.push(block);
          }
        }
      },

      addNewRow: function() {
        // Move all existing blocks down
        this.blocks.forEach(block => {
          block.position.y += 25;
          block.bounds.y += 25;
        });

        // Add new row at the top
        for (let col = 0; col < BLOCKS_PER_ROW; col++) {
          const block = new Block(
            col * BLOCK_WIDTH,
            0,
            BLOCK_COLOURS[Math.floor(Math.random() * BLOCK_COLOURS.length)]
          );
          this.blocks.unshift(block);
        }
        this.lastMoveTime = Date.now();
        console.log('New row added');
      },

      update: function() {
        // Check if it's time to add a new row
        if (this.gameActive && (Date.now() - this.lastMoveTime >= this.moveDownInterval)) {
          console.log('Adding new row...');
          this.addNewRow();
        }

        // Check for game over condition
        if (this.blocks.some(block => block.position.y + block.height >= player.position.y)) {
          endGame();
          return;
        }

        // Update blocks
        this.blocks.forEach(block => block.checkCollision());
        this.blocks = this.blocks.filter(block => !block.hit);
      },

      draw: function() {
        this.blocks.forEach(block => block.draw());
      },

      increaseDifficulty: function() {
        // Calculate speed reduction based on score
        const scoreMultiplier = 1 + (score / DIFFICULTY.SCORE_IMPACT);
        const reduction = DIFFICULTY.SPEED_INCREASE_RATE * scoreMultiplier;
        
        // Update move down interval with score-based reduction
        this.moveDownInterval = Math.max(
            DIFFICULTY.MIN_BLOCK_SPEED,
            this.moveDownInterval - reduction
        );
        
        // Log for debugging
        if (score % 100 === 0) {
            console.log('Current block speed:', this.moveDownInterval);
        }
      }
    };

    // Power-up management
    function updatePowerups() {
      powerups.forEach((powerup, index) => {
        powerup.y += powerup.speed;
        
        if (checkRectCollision(
          { x: powerup.x - powerup.width/2, y: powerup.y - powerup.height/2, w: powerup.width, h: powerup.height },
          player.bounds
        )) {
          activatePowerup(powerup.type);
          powerups.splice(index, 1);
          document.getElementById('powerupSound').play();
        }
        
        if (powerup.y > CANVAS_HEIGHT) {
          powerups.splice(index, 1);
        }
      });
    }

    function activatePowerup(type) {
      console.log('Activating powerup:', type);
      
      switch(type) {
        case 'WIDER_PADDLE':
          if (player.width < player.originalWidth * POWERUP_TYPES[type].maxMultiplier) {
            const currentWidth = player.width;
            const newWidth = Math.min(
                player.originalWidth * POWERUP_TYPES[type].maxMultiplier,
                currentWidth * 1.5
            );
            player.width = newWidth;
            
            setTimeout(() => {
                if (player.width === newWidth) { // Only reset if no other powerup has changed it
                    player.width = player.originalWidth;
                    console.log('Wider paddle effect ended');
                }
            }, POWERUP_TYPES[type].duration);
          }
          break;
          
        case 'EXTRA_LIFE':
          lives++;
          console.log('Extra life added, current lives:', lives);
          break;
          
        case 'MULTI_BALL':
          if (!multiBallActive) {
              multiBallActive = true;
              
              // Always spawn at the starting position
              const startX = player.position.x + player.width / 2;
              const startY = player.position.y - 15;

              for (let i = 0; i < 9; i++) {
                  const newBall = {
                      ...ball,
                      width: 10,
                      height: 10,
                      position: { x: startX, y: startY },
                      velocity: { x: 0, y: 0 },
                      bounds: { x: 0, y: 0, w: 10, h: 10 },
                      playerStick: false,
                      spin: 0,
                      update: ball.update,
                      draw: ball.draw,
                      updatePhysics: ball.updatePhysics
                  };

                  // Random upward direction (-70° to +70° from vertical)
                  const angle = (Math.random() * 140 - 70) * Math.PI / 180;
                  const speed = INITIAL_BALL_SPEED * (0.8 + Math.random() * 0.4); // Random speed variation
                  newBall.velocity.x = Math.sin(angle) * speed;
                  newBall.velocity.y = -Math.cos(angle) * speed; // Negative to go upward
                  
                  extraBalls.push(newBall);
              }
              
              setTimeout(() => {
                  multiBallActive = false;
                  console.log('Multi-ball effect ended');
              }, POWERUP_TYPES[type].duration);
          }
          break;
      }
    }

    function drawPowerups() {
      powerups.forEach(powerup => {
        ctx.fillStyle = POWERUP_TYPES[powerup.type].color;
        ctx.beginPath();
        ctx.arc(powerup.x, powerup.y, powerup.width/2, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // Game management functions
    function initCanvas() {
      canvas = document.getElementById('game-canvas');
      ctx = canvas.getContext('2d');
      document.addEventListener('keydown', e => input[e.keyCode] = true);
      document.addEventListener('keyup', e => input[e.keyCode] = false);
    }

    function sendScore(score) {
      try {
        window.parent.postMessage({
          score: score
        }, '*');
      } catch (error) {
        console.error('Error sending score:', error);
      }
    }

    function endGame(won = false) {
      if (!gameEnded) {
        gameEnded = true;
        gameStarted = false;
        
        // Send score directly to SharePoint webpart
        window.parent.postMessage({
          score: score
        }, '*');
        
        const gameOverDiv = document.getElementById('gameOver');
        gameOverDiv.style.display = 'block';
        gameOverDiv.innerHTML = `
          ${won ? 'Congratulations! You won!' : 'Game Over!'}<br>
          Final Score: ${score}<br>
          Press Space to play again
        `;

        document.addEventListener('keydown', function spaceHandler(e) {
          if (e.keyCode === 32) { // Space key
            document.removeEventListener('keydown', spaceHandler);
            gameOverDiv.style.display = 'none';
            resetGame();
            startGame();
          }
        });
      }
    }

    function resetGame() {
      score = 0;
      lives = 3;
      gameEnded = false;
      input = [];
      powerups = [];
      extraBalls = [];
      multiBallActive = false;
      lastPowerupTime = Date.now();
      lastPowerupSpawnTime = Date.now();
      lastSpeedIncreaseTime = Date.now();
      player.width = player.originalWidth; // Ensure paddle width is reset
      player.init();
      ball.init();
      wall.init();
    }

    function startGame() {
      gameStarted = true;
      animate();
    }

    function animate() {
      if (!gameStarted) return;

      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      particleSystem.update();
      particleSystem.draw(ctx);
      
      updatePowerups();
      player.update();
      ball.update();
      
      // Update and draw extra balls, only remove balls that are below the screen
      extraBalls = extraBalls.filter(extraBall => {
          if (extraBall.position.y <= CANVAS_HEIGHT) {
              extraBall.update();
              extraBall.draw();
              return true;
          }
          return false;
      });

      wall.update();
      wall.draw();
      drawPowerups();
      player.draw();
      ball.draw();

      ctx.font = '16px Arial';
      ctx.fillStyle = 'white';
      ctx.fillText(`Score: ${score}`, 10, CANVAS_HEIGHT - 10);
      ctx.fillText(`Lives: ${lives}`, CANVAS_WIDTH - 70, CANVAS_HEIGHT - 10);

      requestAnimationFrame(animate);
    }

    // Event listeners
    document.addEventListener('keydown', (e) => {
      if (e.keyCode === SHIFT_KEY && ball.playerStick && lives > 0) {
        ball.launch();
      }
    });

    // Initialize game
    window.onload = function() {
      initCanvas();
      resetGame();
      startGame();
    };
  </script>
