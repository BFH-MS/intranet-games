<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gift Tower</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1d3a;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#f7fbff}
  #wrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
  #ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:12px;box-sizing:border-box}
  #ov.hide{display:none}
  .card{pointer-events:auto;text-align:center;max-width:440px;width:100%;box-sizing:border-box;padding:clamp(14px,3.5vh,28px) clamp(16px,4vw,32px);
    background:rgba(11,29,58,.84);border:1px solid rgba(169,214,255,.4);border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
  h1{margin:0 0 6px;font-size:clamp(26px,6vh,40px);color:#f7fbff;letter-spacing:.5px}
  h1 span{color:#f4c542}
  p{margin:6px 0 14px;font-size:clamp(14px,2.6vh,17px);line-height:1.4;color:#d6e8fb}
  .big{font-size:clamp(38px,9vh,60px);font-weight:700;color:#f4c542;line-height:1;margin:4px 0}
  .best{font-size:clamp(14px,2.8vh,18px);color:#a9d6ff;margin-bottom:14px}
  button{font:inherit;font-size:clamp(18px,3.4vh,24px);font-weight:700;color:#fff;background:#d62839;border:0;border-radius:999px;padding:.6em 1.9em;cursor:pointer;box-shadow:0 4px 0 #8f1623,0 8px 18px rgba(0,0,0,.35)}
  button:hover{background:#e63a4b}
  button:active{transform:translateY(2px);box-shadow:0 2px 0 #8f1623}
  button:focus-visible{outline:4px solid #f4c542;outline-offset:3px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" aria-label="Gift Tower game area"></canvas>
  <div id="ov">
    <div class="card" id="card"></div>
  </div>
</div>
<script>
(function () {
'use strict';

/* ---------- pure game rules (no DOM, no state) ---------- */
function computeLanding(topX, topW, newX, newW, tol) {
  var tl = topX - topW / 2, tr = topX + topW / 2;
  var nl = newX - newW / 2, nr = newX + newW / 2;
  var l = Math.max(tl, nl), r = Math.min(tr, nr), ov = r - l;
  if (!(ov > 0.5)) return { hit: false };
  if (Math.abs(newX - topX) <= tol * topW) {
    return { hit: true, perfect: true, x: topX, w: newW, cut: null };
  }
  var c1, c2;
  if (newX > topX) { c1 = r; c2 = nr; } else { c1 = nl; c2 = l; }
  return { hit: true, perfect: false, x: (l + r) / 2, w: ov, cut: { x: (c1 + c2) / 2, w: c2 - c1 } };
}
// Ramps up quickly until block 24, then keeps creeping up so the game never settles.
function speedFor(n, W0) { return W0 * (Math.min(2, 0.85 + 0.05 * (n - 1)) + Math.min(0.8, Math.max(0, n - 24) * 0.015)); }

/* ---------- host bridge: talks to the embedding page (see README) ---------- */
var host = (function () {
  var onBest = null;
  function post(msg) { try { window.parent.postMessage(msg, '*'); } catch (e) { /* not embedded */ } }
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent || !e.data) return;
    var b = e.data.best;
    if (onBest && typeof b === 'number' && isFinite(b) && b >= 0) onBest(Math.floor(b));
  });
  return {
    // Announces the game and receives the player's stored best score.
    ready: function (cb) { onBest = cb; post({ ready: true }); },
    // Reports a finished round.
    submit: function (score) { post({ score: Math.max(0, Math.floor(score)) }); }
  };
})();

var W0 = 200, H = 36, GAP = H * 2, TOL = 0.03, GROUND = 60;
var RESTART_LOCK = 450; // ms the game-over card ignores input, so a late key press does not restart
var STREAK_CAP = 5;      // a perfect streak adds up to this many extra points per gift
var GUIDE_UNTIL = 5;     // the drop guide is only shown for the first gifts
var GOLD_FIRST = 12, GOLD_EVERY = 14, GOLD_VAR = 6;   // blocks until the first golden gift / between two
var COLORS = [
  { b: '#d62839', r: '#f4c542' }, { b: '#1f7a4d', r: '#f7fbff' }, { b: '#a9d6ff', r: '#d62839' },
  { b: '#f7fbff', r: '#d62839' }, { b: '#f4c542', r: '#1f7a4d' }, { b: '#2f64b5', r: '#f7fbff' },
  { b: '#ffd75e', r: '#ffffff' }   // golden gift
];
var PLAIN_COLORS = 6, GOLD_COLOR = 6;
/* Special gifts: 'pulse' swings at an uneven speed, 'ghost' fades in and out, 'turbo' is faster,
   'zigzag' turns around at random, 'gold' restores the full width when it lands perfectly. */
var KIND_LABEL = { pulse: 'Jittery gift!', ghost: 'Ghost gift!', turbo: 'Turbo gift!', zigzag: 'Zigzag gift!', gold: 'Golden gift!' };

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var ov = document.getElementById('ov');
var card = document.getElementById('card');
var reduced = false;
try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

var vw = 800, vh = 600, dpr = 1, sc = 1, vwL = 800, vhL = 560;
var phase = 'ready'; // ready, swing, drop, miss, over
var blocks, cur, debris, fx, sparks, score, streak, best = 0, camY, tAll = 0, missT = 0, pulse = 0, sent = false, overAt = 0, nextGold = 0;
var sleigh = { t: 18, x: 0, active: false };

function rnd(a, b) { return a + Math.random() * (b - a); }
function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function rgb(c) { return 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')'; }

var stars = [], snow = [];
(function () {
  var i;
  for (i = 0; i < 110; i++) stars.push({ u: Math.random(), v: Math.random(), r: rnd(.5, 1.8), f: rnd(.03, .2), tw: rnd(0, 6.28) });
  var ns = reduced ? 14 : 70;
  for (i = 0; i < ns; i++) snow.push({ u: Math.random(), v: Math.random(), r: rnd(1, 3), sp: rnd(20, 50), ph: rnd(0, 6.28) });
})();

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = Math.max(200, window.innerWidth); vh = Math.max(200, window.innerHeight);
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
  sc = Math.min(vh / 560, vw / (W0 * 2.2));
  vwL = vw / sc; vhL = vh / sc;
}
window.addEventListener('resize', resize);

function limA(w) { return Math.max(W0 * 0.6, Math.min(W0 * 1.15, vwL / 2 - w / 2 - 8)); }

function pickKind(n) {
  if (n >= nextGold) { nextGold = n + GOLD_EVERY + Math.floor(Math.random() * GOLD_VAR); return 'gold'; }
  // the share of special gifts grows with the height of the tower
  if (n < 3 || Math.random() > Math.min(0.75, 0.3 + n * 0.012)) return 'plain';
  var kinds = ['pulse'];
  if (n >= 5) kinds.push('turbo');
  if (n >= 8) kinds.push('ghost');
  if (n >= 11) kinds.push('zigzag');
  return kinds[Math.floor(Math.random() * kinds.length)];
}
function spawn() {
  var n = blocks.length, top = blocks[n - 1];
  var side = (n % 2 === 0) ? 1 : -1;
  var A = limA(top.w);
  var kind = pickKind(n);
  cur = { x: side * A, vx: -side, w: top.w, y: n * H + GAP, vy: 0, kind: kind, turnT: rnd(0.5, 1.1), ci: kind === 'gold' ? GOLD_COLOR : n % PLAIN_COLORS };
  if (KIND_LABEL[kind]) fx.push({ txt: KIND_LABEL[kind], x: 0, y: cur.y + H + 34, t: 0, small: true });
}
function reset() {
  blocks = [{ x: 0, w: W0, ci: 0, rib: 0 }];
  debris = []; fx = []; sparks = [];
  score = 0; streak = 0; camY = 0; pulse = 0; sent = false; nextGold = GOLD_FIRST;
  spawn();
}

function drop() {
  if (phase !== 'swing') return;
  phase = 'drop'; cur.vy = 300;
}

function addDebris(x, w, y, ci, rib, dirx) {
  debris.push({ x: x, w: w, y: y, ci: ci, rib: rib, vx: dirx * rnd(50, 110), vy: rnd(60, 160), rot: 0, vr: dirx * rnd(1.5, 3.5) });
}

function land() {
  var n = blocks.length, top = blocks[n - 1];
  var res = computeLanding(top.x, top.w, cur.x, cur.w, TOL);
  if (!res.hit) {
    addDebris(cur.x, cur.w, n * H, cur.ci, cur.x, cur.x >= top.x ? 1 : -1);
    streak = 0; phase = 'miss'; missT = 0.9;
    return;
  }
  var nb = { x: res.x, w: res.w, ci: cur.ci, rib: res.x };
  if (res.cut) addDebris(res.cut.x, res.cut.w, n * H, cur.ci, cur.x, cur.x > top.x ? 1 : -1);
  var gain = 1;
  if (res.perfect) {
    streak++; gain = 1 + Math.min(streak, STREAK_CAP);
    var grew = '';
    if (cur.kind === 'gold' && nb.w < W0) { nb.w = W0; grew = 'Full width!'; }
    else if (streak >= 3 && nb.w < W0) { nb.w = Math.min(W0, nb.w + W0 * 0.05); grew = 'Wider!'; }
    fx.push({ txt: 'Perfect! +' + gain, x: nb.x, y: n * H + H, t: 0 });
    if (grew) fx.push({ txt: grew, x: nb.x, y: n * H + H + 26, t: -0.15, small: true });
    for (var i = 0; i < 16; i++) {
      var a = rnd(0, 6.28), s = rnd(60, 190);
      sparks.push({ x: nb.x + rnd(-nb.w / 2, nb.w / 2), y: n * H + H * 0.6, vx: Math.cos(a) * s, vy: Math.sin(a) * s + 40, t: 0, life: rnd(.5, .9), r: rnd(3, 6) });
    }
  } else streak = 0;
  score += gain; pulse = 1;
  blocks.push(nb);
  spawn();
  phase = 'swing';
}

function endGame() {
  phase = 'over'; overAt = performance.now();
  var s = Math.max(0, Math.floor(score));
  var isNew = s > best;
  if (isNew) best = s;
  if (!sent) { sent = true; host.submit(s); }
  showOver(s, isNew);
}

function showOver(s, isNew) {
  card.innerHTML = '<h1>' + (isNew && s > 0 ? 'New <span>best!</span>' : 'Tower <span>down</span>') + '</h1>' +
    '<div class="big">' + s + '</div><div class="best">points &middot; Best: ' + best + '</div>' +
    '<button id="btn" type="button">Play again</button>';
  ov.classList.remove('hide');
  var b = document.getElementById('btn');
  b.addEventListener('click', startGame);
  try { b.focus({ preventScroll: true }); } catch (e) {}
}
function showStart() {
  card.innerHTML = '<h1>Gift <span>Tower</span></h1>' +
    '<p>Tap, click or press the space bar to drop the gift. Whatever hangs over the edge falls off, so stack as high as you can! Perfect drops in a row score more and more points, and a golden gift placed perfectly makes the tower wide again.</p>' +
    '<button id="btn" type="button">Start</button>';
  ov.classList.remove('hide');
  document.getElementById('btn').addEventListener('click', startGame);
}
function startGame() {
  if (phase === 'over' && performance.now() - overAt < RESTART_LOCK) return;
  reset(); phase = 'swing'; ov.classList.add('hide');
  try { document.activeElement && document.activeElement.blur(); } catch (e) {}
}

canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); drop(); });
window.addEventListener('keydown', function (e) {
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowDown' || e.key === ' ' || e.key === 'ArrowDown') {
    e.preventDefault();
    if (e.repeat) return;
    if (phase === 'ready' || phase === 'over') startGame(); else drop();
  }
});

/* ---------- update ---------- */
function update(dt) {
  tAll += dt;
  var i, n = blocks.length;
  if (pulse > 0) pulse = Math.max(0, pulse - dt * 4);

  if (phase === 'swing' || phase === 'ready') {
    var sp = phase === 'ready' ? W0 * 0.5 : speedFor(n, W0);
    var A = limA(cur.w);
    if (cur.kind === 'pulse') sp *= 1 + 0.6 * Math.sin(tAll * 6);
    if (cur.kind === 'turbo') sp *= 1.45;
    var dir = cur.vx >= 0 ? 1 : -1;
    if (cur.kind === 'zigzag' && phase === 'swing') {
      cur.turnT -= dt;
      if (cur.turnT <= 0) { dir = -dir; cur.turnT = rnd(0.35, 1.1); }
    }
    cur.vx = dir * sp;
    cur.x += cur.vx * dt;
    if (cur.x > A) { cur.x = 2 * A - cur.x; cur.vx = -Math.abs(cur.vx); }
    if (cur.x < -A) { cur.x = -2 * A - cur.x; cur.vx = Math.abs(cur.vx); }
  } else if (phase === 'drop') {
    cur.vy += 5500 * dt;
    cur.y -= cur.vy * dt;
    if (cur.y <= n * H) { cur.y = n * H; land(); }
  } else if (phase === 'miss') {
    missT -= dt;
    if (missT <= 0) endGame();
  }

  // camera
  var act = blocks.length;
  var target = Math.max(0, act * H + GAP - (0.6 * vhL - GROUND));
  camY += (target - camY) * (1 - Math.exp(-4 * dt));

  for (i = debris.length - 1; i >= 0; i--) {
    var d = debris[i];
    d.vy -= 1800 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
    if (d.y < camY - GROUND - 200) debris.splice(i, 1);
  }
  for (i = fx.length - 1; i >= 0; i--) { fx[i].t += dt; if (fx[i].t > 1.1) fx.splice(i, 1); }
  for (i = sparks.length - 1; i >= 0; i--) {
    var p = sparks[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 260 * dt;
    if (p.t > p.life) sparks.splice(i, 1);
  }
  // snow
  for (i = 0; i < snow.length; i++) {
    var s = snow[i];
    s.v += s.sp * dt / vhL; if (s.v > 1) { s.v -= 1; s.u = Math.random(); }
    s.ph += dt;
  }
  // sleigh
  if (!sleigh.active) { sleigh.t -= dt; if (sleigh.t <= 0) { sleigh.active = true; sleigh.x = -0.1; sleigh.y = rnd(.12, .3); } }
  else { sleigh.x += dt / 16; if (sleigh.x > 1.1) { sleigh.active = false; sleigh.t = rnd(20, 35); } }
}

/* ---------- drawing ---------- */
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
}
function sy(wy) { return vhL - GROUND - (wy - camY); }
function sx(wx) { return vwL / 2 + wx; }

// cx = centre x (screen), top = top y (screen), rx = ribbon x (screen)
function gift(cx, top, w, h, ci, rx, bow) {
  var c = COLORS[ci];
  var x = cx - w / 2;
  ctx.save();
  rr(x, top, w, h, Math.min(7, h * .2));
  ctx.fillStyle = c.b; ctx.fill();
  ctx.clip();
  // lid band
  ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(x, top, w, h * 0.3);
  ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.fillRect(x, top + h * 0.3, w, 2);
  ctx.fillStyle = 'rgba(0,0,0,.10)'; ctx.fillRect(x, top + h * 0.8, w, h * 0.2);
  var rw = Math.max(6, h * 0.3);
  ctx.fillStyle = c.r; ctx.fillRect(rx - rw / 2, top, rw, h);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(rx - rw / 2, top + h * 0.3, rw, 2);
  ctx.restore();
  rr(x + .5, top + .5, w - 1, h - 1, Math.min(7, h * .2));
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.stroke();
  if (bow) {
    var bx = Math.max(x + 14, Math.min(x + w - 14, rx)), by = top;
    ctx.fillStyle = c.r; ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1.2;
    for (var k = -1; k <= 1; k += 2) {
      ctx.save(); ctx.translate(bx + k * 8, by - 5); ctx.rotate(k * 0.45);
      ctx.beginPath(); ctx.ellipse(0, 0, 9, 5.5, 0, 0, 6.283); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(bx, by - 2, 4, 0, 6.283); ctx.fill(); ctx.stroke();
  }
}

function drawBg() {
  var t = Math.min(1, camY / (H * 45));
  var g = ctx.createLinearGradient(0, 0, 0, vhL);
  g.addColorStop(0, rgb(mix([11, 29, 58], [3, 8, 22], t)));
  g.addColorStop(1, rgb(mix([28, 59, 107], [11, 29, 58], t * 0.8)));
  ctx.fillStyle = g; ctx.fillRect(0, 0, vwL, vhL);
  var i;
  // aurora
  var aa = 0.04 + 0.16 * t;
  if (aa > 0.045) {
    ctx.lineCap = 'round';
    for (i = 0; i < 2; i++) {
      ctx.beginPath();
      for (var x = -20; x <= vwL + 20; x += 24) {
        var y = vhL * (0.25 + i * 0.12) + Math.sin(x * 0.008 + tAll * 0.25 + i * 2) * 30 + Math.sin(x * 0.02 - tAll * 0.15) * 10;
        if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = i ? 'rgba(120,150,255,' + aa * 0.7 + ')' : 'rgba(80,230,170,' + aa + ')';
      ctx.lineWidth = i ? 40 : 55; ctx.stroke();
    }
  }
  // stars
  var sa = 0.35 + 0.5 * t;
  for (i = 0; i < stars.length; i++) {
    var s = stars[i];
    var y2 = (((s.v * vhL + camY * s.f) % vhL) + vhL) % vhL;
    var tw = reduced ? 1 : 0.7 + 0.3 * Math.sin(tAll * 1.5 + s.tw);
    ctx.fillStyle = 'rgba(247,251,255,' + (sa * tw) + ')';
    ctx.beginPath(); ctx.arc(s.u * vwL, y2, s.r, 0, 6.283); ctx.fill();
  }
  // sleigh
  if (sleigh.active) {
    var px = sleigh.x * vwL, py = sleigh.y * vhL + Math.sin(sleigh.x * 6) * 8;
    ctx.save(); ctx.translate(px, py); ctx.fillStyle = 'rgba(169,214,255,.28)'; ctx.strokeStyle = 'rgba(169,214,255,.28)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(22, 0); ctx.quadraticCurveTo(28, -2, 27, -9); ctx.lineTo(24, -9); ctx.quadraticCurveTo(22, -4, 16, -5); ctx.lineTo(2, -5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2, 4); ctx.quadraticCurveTo(14, 6, 28, 3); ctx.stroke();
    ctx.beginPath(); ctx.arc(8, -9, 3.5, 0, 6.283); ctx.fill();
    for (var k = 0; k < 3; k++) {
      var rx = 38 + k * 16;
      ctx.beginPath(); ctx.ellipse(rx, -3, 5, 2.8, 0, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.moveTo(rx + 4, -4); ctx.lineTo(rx + 8, -8); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(27, -3); ctx.lineTo(36, -3); ctx.stroke();
    ctx.restore();
  }
  // snow
  ctx.fillStyle = 'rgba(247,251,255,.75)';
  for (i = 0; i < snow.length; i++) {
    var f = snow[i];
    var yy = (((f.v * vhL + camY * 0.3 * f.r / 3) % vhL) + vhL) % vhL;
    var xx = f.u * vwL + Math.sin(f.ph) * 10;
    ctx.globalAlpha = 0.35 + f.r * 0.15;
    ctx.beginPath(); ctx.arc(xx, yy, f.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawGround() {
  var gy = sy(0);
  if (gy > vhL + 30) return;
  var cx = sx(0);
  // sled
  ctx.fillStyle = '#7a4a2a'; rr(cx - W0 / 2 - 20, gy, W0 + 40, 9, 4); ctx.fill();
  ctx.strokeStyle = '#c9a36b'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx - W0 / 2 - 24, gy + 14); ctx.lineTo(cx + W0 / 2 + 14, gy + 14);
  ctx.quadraticCurveTo(cx + W0 / 2 + 30, gy + 14, cx + W0 / 2 + 26, gy + 2); ctx.stroke();
  // snow
  var g = ctx.createLinearGradient(0, gy, 0, gy + GROUND + 60);
  g.addColorStop(0, '#f7fbff'); g.addColorStop(1, '#a9d6ff');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, gy + 12);
  for (var x = 0; x <= vwL; x += 30) ctx.lineTo(x, gy + 12 - Math.abs(Math.sin(x * 0.02)) * 5 + 3);
  ctx.lineTo(vwL, vhL + 100); ctx.lineTo(0, vhL + 100); ctx.closePath(); ctx.fill();
}

function drawHUD() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  var fs = Math.max(40, Math.min(84, vh * 0.12)) * (1 + pulse * 0.18);
  ctx.font = '700 ' + fs + 'px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillText(String(score), vw / 2 + 2, Math.max(60, vh * 0.12) + 3);
  ctx.fillStyle = '#f7fbff'; ctx.fillText(String(score), vw / 2, Math.max(60, vh * 0.12));
  ctx.textAlign = 'right';
  ctx.font = '600 ' + Math.max(14, Math.min(20, vh * 0.032)) + 'px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = '#a9d6ff';
  ctx.fillText('Best ' + best, vw - 16, 30);
}

function draw() {
  ctx.setTransform(dpr * sc, 0, 0, dpr * sc, 0, 0);
  drawBg();
  drawGround();
  var i, b;
  for (i = 0; i < blocks.length; i++) {
    b = blocks[i];
    var t = sy(i * H + H);
    if (t > vhL + 5 || t < -H - 5) continue;
    gift(sx(b.x), t, b.w, H, b.ci, sx(b.rib), false);
  }
  if (phase === 'swing' || phase === 'drop' || phase === 'ready') {
    var ghost = cur.kind === 'ghost' && phase === 'swing';
    if (phase !== 'drop' && !ghost && blocks.length <= GUIDE_UNTIL) { // soft drop guide, a help for the first gifts only
      ctx.fillStyle = 'rgba(247,251,255,.07)';
      ctx.fillRect(sx(cur.x) - cur.w / 2, sy(cur.y), cur.w, vhL);
    }
    if (ghost) ctx.globalAlpha = 0.1 + 0.9 * Math.max(0, Math.sin(tAll * 3.2));
    gift(sx(cur.x), sy(cur.y + H), cur.w, H, cur.ci, sx(cur.x), true);
    ctx.globalAlpha = 1;
  }
  for (i = 0; i < debris.length; i++) {
    var d = debris[i];
    ctx.save();
    ctx.translate(sx(d.x), sy(d.y + H / 2)); ctx.rotate(d.rot);
    var rx = Math.max(-d.w / 2 + 6, Math.min(d.w / 2 - 6, d.rib - d.x));
    gift(0, -H / 2, d.w, H, d.ci, rx, false);
    ctx.restore();
  }
  // sparks
  for (i = 0; i < sparks.length; i++) {
    var p = sparks[i], a = 1 - p.t / p.life;
    ctx.save(); ctx.translate(sx(p.x), sy(p.y)); ctx.rotate(p.t * 4); ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = '#f4c542'; ctx.beginPath();
    for (var k = 0; k < 8; k++) { var rad = k % 2 ? p.r * 0.35 : p.r; var an = k * Math.PI / 4; ctx.lineTo(Math.cos(an) * rad, Math.sin(an) * rad); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  // popups
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (i = 0; i < fx.length; i++) {
    var f = fx[i]; if (f.t < 0) continue;
    var al = f.t < 0.8 ? 1 : Math.max(0, 1 - (f.t - 0.8) / 0.3);
    var pop = f.t < 0.15 ? 0.7 + f.t / 0.15 * 0.3 : 1;
    ctx.save(); ctx.globalAlpha = al;
    ctx.translate(sx(f.x), sy(f.y) - f.t * 40 - 14); ctx.scale(pop, pop);
    ctx.font = '700 ' + (f.small ? 16 : 24) + 'px "Segoe UI",system-ui,sans-serif';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(11,29,58,.8)'; ctx.strokeText(f.txt, 0, 0);
    ctx.fillStyle = f.small ? '#a9d6ff' : '#f4c542'; ctx.fillText(f.txt, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  drawHUD();
}

/* ---------- loop ---------- */
/* Frame clock. Some browsers report frame timestamps coarsely (several frames share one value, then
   it jumps). The clock follows real time but spreads such jumps over a few frames, so the game
   neither stalls on a repeated timestamp nor loses time. Returns seconds since the previous frame. */
var clockT = 0;
function frameDelta(ts) {
  if (!clockT || ts < clockT || ts - clockT > 1000) { clockT = ts; return 0; }   // first frame, or back from a pause
  var d = Math.min(100, (ts - clockT) * 0.25);
  clockT += d;
  return d / 1000;
}
var raf = 0;
function frame(ts) {
  raf = requestAnimationFrame(frame);
  update(Math.min(0.05, frameDelta(ts)));
  draw();
}
function startLoop() { if (!raf) { clockT = 0; raf = requestAnimationFrame(frame); } }
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = 0; } else startLoop();
});

resize();
reset();
phase = 'ready';
showStart();
startLoop();
host.ready(function (b) { if (b > best) best = b; });
})();
</script>
</body>
</html>
