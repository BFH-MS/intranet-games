        }

        // ==================== GAME LOGIC ====================
        const eggColors = [
          { c: "#ffcdd2", a: "#e57373" },
          { c: "#f8bbd0", a: "#f06292" },
          { c: "#e1bee7", a: "#ba68c8" },
          { c: "#c5cae9", a: "#7986cb" },
          { c: "#b3e5fc", a: "#4fc3f7" },
          { c: "#fff9c4", a: "#fff176" },
          { c: "#ffe0b2", a: "#ffb74d" },
          { c: "#c8e6c9", a: "#81c784" },
        ];

        function throwEgg(tx, ty) {
          if (eggsLeft <= 0 || !running || paused) return;
          if (showHint) {
            showHint = false;
            hintAlpha = 0;
          }
          eggsLeft--;
          ea();
          sndThrow();
          const col = pick(eggColors);
          const sx = W / 2,
            sy = H + 20;
          const dx = tx - sx,
            dy = ty - sy;
          const d2 = Math.hypot(dx, dy);
          const speed = Math.max(800, d2 * 2.5);
          projectiles.push({
            x: sx,
            y: sy,
            vx: (dx / d2) * speed,
            vy: (dy / d2) * speed,
            rot: Math.atan2(dy, dx),
            color: col.c,
            accent: col.a,
            life: 0.8,
          });
        }

        function makeSplat(x, y, color) {
          const drops = [];
          for (let i = 0; i < randI(4, 7); i++) {
            const a = rand(0, Math.PI * 2),
              d2 = rand(10, 30);
            drops.push({ x: x + Math.cos(a) * d2, y: y + Math.sin(a) * d2, r: rand(3, 6) });
          }
          splats.push({ x, y, r: rand(10, 18), color, drops, alpha: 1, life: 10 });
        }
        function burstParticles(x, y, colors, n = 14) {
          for (let i = 0; i < n; i++) {
            const a = rand(0, Math.PI * 2),
              sp = rand(80, 250);
            particles.push({
              x,
              y,
              vx: Math.cos(a) * sp,
              vy: Math.sin(a) * sp - rand(30, 100),
              life: rand(0.3, 0.7),
              ml: 0.7,
              sz: rand(3, 7),
              color: pick(colors),
              grav: 400,
              rot: rand(0, 6.28),
              rotSpd: rand(-8, 8),
              shape: Math.random() < 0.4 ? "rect" : "circle",
            });
          }
        }
        function addText(x, y, text, color, sz = 18) {
          texts.push({ x, y, text, color, sz, life: 0.9 });
        }
        function spawnConfetti(n = 60) {
          for (let i = 0; i < n; i++) {
            confetti.push({
              x: rand(0, W),
              y: rand(-200, -50),
              vx: rand(-40, 40),
              vy: rand(60, 200),
              rot: rand(0, 6.28),
              rotSpd: rand(-6, 6),
              w: rand(4, 10),
              h: rand(6, 14),
              color: pick([
                "#e57373",
                "#f06292",
                "#ba68c8",
                "#7986cb",
                "#4fc3f7",
                "#fff176",
                "#ffb74d",
                "#81c784",
                "#ffd54f",
                "#ff8a65",
              ]),
              life: rand(2, 4),
              ml: 4,
              grav: 60 + rand(0, 40),
            });
          }
        }

        function reset() {
          score = 0;
          elapsed = 0;
          eggsLeft = 12;
          eggsMax = 12;
          gameOverTimer = 0;
          combo = 1;
          hits = 0;
          misses = 0;
          maxCombo = 1;
          projectiles = [];
          particles = [];
          splats = [];
          texts = [];
          confetti = [];
          shakeDur = 0;
          shakeX = 0;
          shakeY = 0;
          showHint = true;
          hintAlpha = 1;
          bunny = {
            x: W / 2,
            y: groundY(),
            state: "idle",
            stateTimer: 0,
            targetX: W / 2,
            targetY: groundY(),
            dir: 1,
            hitFlash: 0,
            coverIdx: -1,
            peekDir: 0,
            visible: true,
            speed: 180,
            scale: 1,
            jumpT: 0,
            hideProgress: 0,
          };
        }

        function update(dt) {
          elapsed += dt;

          if (showHint) {
            hintAlpha = Math.min(1, hintAlpha + dt);
          }
          if (shakeDur > 0) {
            shakeDur -= dt;
            const f = shakeDur / 0.2;
            shakeX = (Math.random() - 0.5) * 8 * f;
            shakeY = (Math.random() - 0.5) * 8 * f;
            if (shakeDur <= 0) {
              shakeX = 0;
              shakeY = 0;
            }
          }

          bunnyAI(dt);

          for (let i = projectiles.length - 1; i >= 0; i--) {
            const p = projectiles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 200 * dt;
            p.rot = Math.atan2(p.vy, p.vx);
            p.life -= dt;

            if (bunny.visible && bunny.state !== "hiding" && !(bunny.state === "side_swap" && bunny.sideSwapPhase === 1)) {
              // Hit detection — hitbox aligned with visual center
              // Body center is drawn at y-20, head at y-52, full height ~90px
              let hitCX = bunny.x,
                hitCY = bunny.y - 35,
                hitR = 30;
              if (bunny.state === "head_peeking" || bunny.state === "fake_peek") {
                // Head drawn at bunny.y (center of arc), ears extend to y-28
                hitCY = bunny.y - 5;
                hitR = 22;
              } else if (bunny.state === "peeking" || bunny.state === "side_swap" || bunny.state === "taunt_peek") {
                // Body center drawn at y-20
                hitCY = bunny.y - 20;
                hitR = 25;
              }
              if (dist(p.x, p.y, hitCX, hitCY) < hitR + 12) {
                sndHit();
                bunny.hitFlash = 0.3;
                const basePts =
                  bunny.state === "fake_peek"
                    ? 50
                    : bunny.state === "taunt_peek"
                      ? 45
                      : bunny.state === "head_peeking"
                        ? 40
                        : bunny.state === "side_swap"
                          ? 35
                          : bunny.state === "peeking"
                            ? 30
                            : bunny.state === "running" || bunny.state === "jumping"
                              ? 20
                              : 15;
                const gained = basePts * combo;
                score += gained;
                hits++;
                combo = Math.min(10, combo + 1);
                if (combo > maxCombo) maxCombo = combo;
                if (combo >= 3 && combo % 2 === 1) sndCombo();
                burstParticles(p.x, p.y, [p.color, p.accent, "#fff", "#ffd54f"], 18);
                makeSplat(p.x, p.y, p.color);
                addText(p.x, p.y - 20, "+" + gained, "#2e7d32", 22);
                if (combo >= 3) addText(p.x, p.y - 45, "x" + combo + "!", "#ff6b9d", 16);
                // Earn eggs back on hits — this is how you survive
                let eggsEarned = 1; // every hit gives back 1 egg
                if (bunny.state === "head_peeking" || bunny.state === "fake_peek") eggsEarned = 2; // head/fake peek = 2
                if (combo >= 4) eggsEarned++; // combo bonus
                eggsEarned = Math.min(eggsEarned, eggsMax - eggsLeft);
                if (eggsEarned > 0) {
                  eggsLeft += eggsEarned;
                  addText(
                    p.x,
                    p.y - 65,
                    "+" + eggsEarned + " egg" + (eggsEarned > 1 ? "s" : ""),
                    "#1565c0",
                    13,
                  );
                }
                // Hit reaction — bunny panics with visible evasion
                const hSpd = difficulty().bunnySpd;
                const fleeDir = p.x < bunny.x ? 1 : -1;
                // Try to find a cover far enough away (min 150px) for a visible flee
                let farCover = -1;
                if (Math.random() < 0.35 && covers.length > 0) {
                  let bestD = 0;
                  for (let ci = 0; ci < covers.length; ci++) {
                    const dd = Math.abs(covers[ci].x - bunny.x);
                    if (dd >= 150 && dd > bestD) {
                      bestD = dd;
                      farCover = ci;
                    }
                  }
                }
                if (farCover >= 0) {
                  // Flee to a distant cover — run is clearly visible
                  bunny.state = "moving_to_cover";
                  bunny.coverIdx = farCover;
                  bunny.targetX = covers[farCover].x;
                  bunny.targetY = groundY();
                  bunny.speed = rand(220, 300) * hSpd;
                  bunny.stateTimer = 3;
                } else if (Math.random() < 0.5) {
                  // Panicked jump in opposite direction
                  bunny.state = "jumping";
                  bunny.jumpT = 0;
                  bunny.targetX = clamp(bunny.x + fleeDir * rand(180, 350), 80, W - 80);
                  bunny.targetY = groundY();
                  bunny.speed = rand(200, 280) * hSpd;
                  bunny.stateTimer = 3;
                } else {
                  // Sprint away from egg impact
                  bunny.state = "running";
                  bunny.targetX = clamp(bunny.x + fleeDir * rand(200, 400), 80, W - 80);
                  bunny.targetY = groundY();
                  bunny.speed = rand(240, 320) * hSpd;
                  bunny.stateTimer = 3;
                }
                bunny.visible = true;
                projectiles.splice(i, 1);
                continue;
              }
            }

            if (p.life <= 0 || p.x < -50 || p.x > W + 50 || p.y < -50 || p.y > H + 50) {
              if (p.y < groundY()) {
                misses++;
                combo = 1;
                sndMiss();
                makeSplat(p.x, clamp(p.y, 20, H - 20), p.color);
                addText(p.x, p.y, "miss", "rgba(255,255,255,.5)", 14);
              }
              projectiles.splice(i, 1);
            }
          }

          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.life -= dt;
            p.vy += p.grav * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.rot += p.rotSpd * dt;
            if (p.life <= 0) particles.splice(i, 1);
          }
          for (let i = splats.length - 1; i >= 0; i--) {
            splats[i].life -= dt;
            splats[i].alpha = clamp(splats[i].life / 3, 0, 0.8);
            if (splats[i].life <= 0) splats.splice(i, 1);
          }
          for (let i = texts.length - 1; i >= 0; i--) {
            texts[i].life -= dt;
            texts[i].y -= 30 * dt;
            if (texts[i].life <= 0) texts.splice(i, 1);
          }
          for (let i = confetti.length - 1; i >= 0; i--) {
            const c = confetti[i];
            c.life -= dt;
            c.x += c.vx * dt;
            c.y += c.vy * dt;
            c.vy += c.grav * dt;
            c.rot += c.rotSpd * dt;
            if (c.life <= 0) confetti.splice(i, 1);
          }

          // Game over: 0 eggs + nothing in flight = done (small grace period so last egg can land)
          if (eggsLeft <= 0 && projectiles.length === 0) {
            gameOverTimer += dt;
            if (gameOverTimer > 0.5) endGame();
          } else {
            gameOverTimer = 0;
          }
        }

        function render(now) {
          X.save();
          X.translate(shakeX, shakeY);
          drawSky(now);
          drawBirds(now);
          drawBgTrees();
          drawGround(now);
          drawGrassEggs();
          drawButterflies(now);
          drawBasket();
          splats.forEach(drawSplat);

          // Z-order covers + bunny
          const sortedCovers = [...covers].sort((a, b) => a.x - b.x);
          const bunnyDrawn = { done: false };
          const hidingCover =
            (bunny.state === "hiding" ||
              bunny.state === "peeking" ||
              bunny.state === "head_peeking" ||
              bunny.state === "fake_peek" ||
              bunny.state === "side_swap" ||
              bunny.state === "taunt_peek") &&
            bunny.coverIdx >= 0
              ? covers[bunny.coverIdx]
              : null;

          sortedCovers.forEach((c) => {
            if (!bunnyDrawn.done && hidingCover === c) {
              // Draw bunny BEHIND this cover, then cover on top
              drawBunny();
              drawCover(c);
              bunnyDrawn.done = true;
            } else if (!bunnyDrawn.done && c.x >= bunny.x && !hidingCover) {
              drawBunny();
              bunnyDrawn.done = true;
              drawCover(c);
            } else {
              drawCover(c);
            }
          });
          if (!bunnyDrawn.done) drawBunny();

          projectiles.forEach(drawProjectile);
          particles.forEach(drawParticle);
          texts.forEach(drawText);
          drawConfetti();
          if (running) {
            drawWoodenSign(now);
            drawHint(now);
          }
          X.restore();
        }

        function loop(now) {
          if (paused) return;
          const dt = Math.min(0.033, (now - lastT) / 1000);
          lastT = now;
          if (running) update(dt);
          render(now);
          if (running) animId = requestAnimationFrame(loop);
        }

        function begin() {
          reset();
          generateCovers();
          lastT = performance.now();
          running = true;
          paused = false;
          startBgm();
          $("ss").classList.add("h");
          $("es").classList.add("h");
          $("ps").classList.add("h");
          if (animId) cancelAnimationFrame(animId);
          animId = requestAnimationFrame(loop);
        }

        function startCD() {
          ea();
          clearInterval(cdI);
          $("cd").classList.remove("h");
          $("ss").classList.add("h");
          $("es").classList.add("h");
          let c = 3;
          $("cd").textContent = c;
          cdI = setInterval(() => {
            c--;
            if (c > 0) $("cd").textContent = c;
            else if (c === 0) $("cd").textContent = "GO!";
            else {
              clearInterval(cdI);
              $("cd").classList.add("h");
              begin();
            }
          }, 550);
        }

        function endGame() {
          running = false;
          paused = false;
          stopBgm();
          const best = getHS();
          if (score > best) setHS(score);
          const isNew = score > best && score > 0;
          const ratio = hits / (hits + misses || 1);
          if (ratio > 0.7) $("endTitle").textContent = "Amazing!";
          else if (ratio > 0.4) $("endTitle").textContent = "Not Bad!";
          else $("endTitle").textContent = "Game Over!";
          $("fs").textContent = score;
          $("bestBadge").innerHTML = isNew ? '<div class="new-best">NEW BEST!</div>' : "";
          $("bsl").textContent = "Best: " + getHS();
          const mins = Math.floor(elapsed / 60);
          const secs = Math.floor(elapsed % 60);
          $("endStats").innerHTML = `
<div class="stat-item"><div class="stat-val">${hits}</div><div class="stat-lbl">Hits</div></div>
<div class="stat-item"><div class="stat-val">${misses}</div><div class="stat-lbl">Misses</div></div>
<div class="stat-item"><div class="stat-val">x${maxCombo}</div><div class="stat-lbl">Best Combo</div></div>
<div class="stat-item"><div class="stat-val">${mins}:${String(secs).padStart(2, "0")}</div><div class="stat-lbl">Survived</div></div>`;
          $("es").classList.remove("h");
          if (score > 100 || isNew) spawnConfetti(80);
          // Send score to parent window (SharePoint web part) — delayed so game over screen shows first
          setTimeout(() => {
            try {
              window.parent.postMessage(
                {
                  game: "EasterEggToss",
                  score: score,
                  time: Math.floor(elapsed),
                  hits: hits,
                  misses: misses,
                  maxCombo: maxCombo,
                  isNewBest: isNew,
                },
                "*",
              );
            } catch (e) {
              console.error("Error sending score:", e);
            }
          }, 3000);
          if (confetti.length > 0) {
            const confettiLoop = () => {
              const dt = 0.016;
              for (let i = confetti.length - 1; i >= 0; i--) {
                const c = confetti[i];
                c.life -= dt;
                c.x += c.vx * dt;
                c.y += c.vy * dt;
                c.vy += c.grav * dt;
                c.rot += c.rotSpd * dt;
                if (c.life <= 0) confetti.splice(i, 1);
              }
              render(performance.now());
              if (confetti.length > 0) requestAnimationFrame(confettiLoop);
            };
            requestAnimationFrame(confettiLoop);
          }
        }

        function togglePause() {
          if (!running) return;
          paused = !paused;
          if (paused) {
            const mins = Math.floor(elapsed / 60);
            const secs = Math.floor(elapsed % 60);
            $("pauseStats").innerHTML =
              `<div class="stat-item"><div class="stat-val">${score}</div><div class="stat-lbl">Score</div></div>
<div class="stat-item"><div class="stat-val">${mins}:${String(secs).padStart(2, "0")}</div><div class="stat-lbl">Time</div></div>
<div class="stat-item"><div class="stat-val">${eggsLeft}</div><div class="stat-lbl">Eggs</div></div>`;
            $("ps").classList.remove("h");
            if (animId) cancelAnimationFrame(animId);
            stopBgm();
          } else {
            $("ps").classList.add("h");
            lastT = performance.now();
            animId = requestAnimationFrame(loop);
            startBgm();
          }
        }

        function goMenu() {
          running = false;
          paused = false;
          stopBgm();
          clearInterval(cdI);
          $("cd").classList.add("h");
          $("ps").classList.add("h");
          $("es").classList.add("h");
          $("ss").classList.remove("h");
          generateCovers();
          render(performance.now());
        }

        // Init
        resize();
        generateCovers();
        score = 0;
        elapsed = 0;
        eggsLeft = 12;
        eggsMax = 12;
        gameOverTimer = 0;
        combo = 1;
        hits = 0;
        misses = 0;
        maxCombo = 1;
        projectiles = [];
        particles = [];
        splats = [];
        texts = [];
        confetti = [];
        bunny = {
          x: W / 2,
          y: groundY(),
          state: "taunt",
          stateTimer: 2,
          targetX: W / 2,
          targetY: groundY(),
          dir: 1,
          hitFlash: 0,
          coverIdx: -1,
          peekDir: 0,
          visible: true,
          speed: 180,
          scale: 1,
          jumpT: 0,
          hideProgress: 0,
        };
        render(performance.now());
        // Re-render after iframe layout settles (fixes blank screen on SP reload)
        setTimeout(() => { resize(); render(performance.now()); }, 100);
        setTimeout(() => { resize(); render(performance.now()); }, 500);

        window.addEventListener("resize", () => {
          resize();
          render(performance.now());
        });
        C.addEventListener("click", (e) => {
          const r = C.getBoundingClientRect();
          throwEgg(e.clientX - r.left, e.clientY - r.top);
        });
        C.addEventListener(
          "touchstart",
          (e) => {
            e.preventDefault();
            const r = C.getBoundingClientRect();
            const t = e.touches[0];
            throwEgg(t.clientX - r.left, t.clientY - r.top);
          },
          { passive: false },
        );
        document.addEventListener("keydown", (e) => {
          if ((e.key === "Escape" || e.key === "p" || e.key === "P") && running) togglePause();
        });

        $("goBtn").addEventListener("click", startCD);
        $("agBtn").addEventListener("click", startCD);
        $("mnBtn").addEventListener("click", goMenu);
        $("resBtn").addEventListener("click", togglePause);
        $("qBtn").addEventListener("click", goMenu);
      })();
    </script>
  </body>
</html>
